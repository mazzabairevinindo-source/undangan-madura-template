<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b0b15">
  <title>Atur Ulang Kata Sandi — Undangan Madura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--maroon:#3b0b15;--gold:#c79b50;--cream:#f5ecdf;--ink:#32111a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,520px);background:#fffaf3;border:1px solid #dec59f;box-shadow:0 18px 48px #3b0b1518;padding:clamp(24px,5vw,42px)}
    .brand{background:var(--maroon);color:#f6dfae;padding:14px 20px;margin:-42px -42px 28px;font-size:12px;font-weight:700;letter-spacing:.14em}
    h1{font-family:"Playfair Display",serif;font-size:clamp(28px,5vw,38px);font-weight:500;margin:0 0 8px}p{line-height:1.6;color:#725e53}
    label{display:block;font-weight:600;margin:18px 0 7px}input{display:block;width:100%;padding:13px 14px;border:1px solid #d8c3a6;background:#fff;font:inherit;color:#32111a;border-radius:3px}
    button{border:0;background:var(--maroon);color:#f8dfad;padding:14px 20px;font:700 14px "DM Sans",sans-serif;cursor:pointer;width:100%;margin-top:22px;border-radius:3px}button:disabled{opacity:.6;cursor:wait}
    .status{padding:12px 14px;margin-top:18px;background:#f5eee4;border-left:3px solid var(--gold);font-size:14px;line-height:1.5;overflow-wrap:anywhere}.status.error{background:#fff0ef;border-color:#b42318;color:#9b1c1c}.status.success{background:#edf7ef;border-color:#218653;color:#17633d}
    .back{display:block;margin-top:20px;text-align:center;color:#79511f;font-size:14px}
    [hidden]{display:none!important}
    @media(max-width:480px){.brand{margin:-24px -24px 24px}.card{padding:24px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">✦ UNDANGAN MADURA</div>
    <h1>Atur Ulang Kata Sandi</h1>
    <p>Masukkan kata sandi baru untuk akun admin Undangan Madura. Halaman ini hanya dapat digunakan melalui tautan pemulihan email yang masih berlaku.</p>
    <form id="resetForm" hidden>
      <label for="newPassword">Kata sandi baru</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter">
      <label for="confirmPassword">Ulangi kata sandi baru</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulangi kata sandi">
      <button id="savePassword" type="submit">Simpan Kata Sandi Baru</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite">Memeriksa tautan pemulihan…</div>
    <a class="back" href="admin.html">Kembali ke halaman admin</a>
  </main>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const statusNode = document.getElementById("status");
      const form = document.getElementById("resetForm");
      const button = document.getElementById("savePassword");
      const cfg = window.SUPABASE_CONFIG || {};
      const url = String(cfg.url || "").trim().replace(/\/+$/g, "").replace(/\/rest\/v1$/i, "");
      const key = String(cfg.publishableKey || "").trim();
      const STORAGE_KEY = "undanganMadura.supabase.recovery.v1";
      let client;
      let recoveryReady = false;

      function status(message, type="info") {
        statusNode.textContent = message;
        statusNode.className = `status ${type}`;
      }
      function showForm() {
        recoveryReady = true;
        form.hidden = false;
        status("Tautan pemulihan valid. Silakan buat kata sandi baru.", "success");
      }

      if (!url || !key || !window.supabase?.createClient) {
        status("Konfigurasi Supabase tidak ditemukan. Periksa supabase-config.js dan koneksi internet.", "error");
        return;
      }

      client = window.supabase.createClient(url, key, {
        auth: {
          storageKey: STORAGE_KEY,
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce"
        }
      });

      client.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) showForm();
      });

      (async () => {
        const { data, error } = await client.auth.getSession();
        if (error) {
          status("Tautan pemulihan tidak dapat diverifikasi. Minta tautan baru dari halaman admin.", "error");
          return;
        }
        if (data?.session) {
          showForm();
          return;
        }
        const params = new URLSearchParams(location.search);
        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        const errorCode = params.get("error_description") || hash.get("error_description") || params.get("error") || hash.get("error");
        status(errorCode ? `Tautan pemulihan bermasalah: ${errorCode}. Minta tautan baru.` : "Belum ada sesi pemulihan. Buka tautan terbaru dari email Reset Password pada perangkat dan browser yang sama.", "error");
      })();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!recoveryReady) return;
        const password = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
        if (password.length < 8) return status("Kata sandi minimal 8 karakter.", "error");
        if (password !== confirm) return status("Kedua kata sandi belum sama.", "error");
        button.disabled = true;
        button.textContent = "Menyimpan…";
        const { error } = await client.auth.updateUser({ password });
        button.disabled = false;
        button.textContent = "Simpan Kata Sandi Baru";
        if (error) {
          status(error.message || "Kata sandi tidak berhasil diperbarui.", "error");
          return;
        }
        await client.auth.signOut();
        form.hidden = true;
        status("Kata sandi berhasil diperbarui. Silakan kembali ke halaman admin dan masuk dengan kata sandi baru.", "success");
      });
    })();
  </script>
</body>
</html>
